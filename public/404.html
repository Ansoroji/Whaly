<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta
      name="description"
      content="La página que buscas no existe o ya no está disponible."
    />
    <meta name="theme-color" content="#351e73" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Página no encontrada | Whaly Seguros</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #351e73;
        background: #b9c0ea;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        text-align: center;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 8vw, 64px);
        border: 2px solid #351e73;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 12px 0 rgba(53, 30, 115, 0.14);
      }

      .brand {
        margin: 0 0 24px;
        color: #351e73;
        font-size: 24px;
        font-weight: 850;
        letter-spacing: -0.06em;
      }

      .code {
        margin: 0;
        font-size: clamp(64px, 14vw, 100px);
        font-weight: 900;
        line-height: 1;
      }

      h1 {
        margin: 16px 0;
        font-size: clamp(26px, 5vw, 38px);
        line-height: 1.15;
      }

      p {
        color: #51466d;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        margin-top: 12px;
        padding: 12px 24px;
        border: 2px solid #351e73;
        border-radius: 14px;
        background: #bfeac1;
        box-shadow: 0 5px 0 rgba(53, 30, 115, 0.14);
        color: #351e73;
        font-weight: 750;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #4f6f71;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">whaly</p>
      <p class="code" aria-hidden="true">404</p>
      <h1>Esta página no está disponible</h1>
      <p>Revisa la dirección o vuelve al inicio para seguir explorando.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
